[workspace]
members = [
    "crates/reestream-core",
    "crates/reestream-ffmpeg",
    "crates/reestream-server",
]
resolver = "2"

[package]
name = "reestream"
version = "0.2.0"
edition = "2024"
authors = ["RustLangES contact@rustlang-es.org"]
description = "RTMP multistream demuxer with HLS, FFmpeg, and web API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustLangES/reestream"

[features]
default = ["core"]
core = ["dep:reestream-core"]
hls = ["dep:reestream-server", "reestream-server/hls"]
api = ["dep:reestream-server", "reestream-server/api"]
srt = []
ffmpeg = ["dep:reestream-ffmpeg"]
preview = ["hls"]
all = ["hls", "api", "ffmpeg", "preview"]

[dependencies]
reestream-core = { path = "crates/reestream-core", optional = true }
reestream-ffmpeg = { path = "crates/reestream-ffmpeg", optional = true }
reestream-server = { path = "crates/reestream-server", optional = true }

clap = { version = "4.5.54", features = ["derive"] }
tokio = { version = "1", default-features = false, features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "time",
    "signal",
    "sync",
] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = "0.3"

[dev-dependencies]
bytes = "1.10"
rml_rtmp = "0.8"
serde_json = "1"
url = "2.5"
proptest = "1"
